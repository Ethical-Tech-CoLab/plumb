name: Deploy Plumb client to GitHub Pages

# The Plumb field client is a static, dependency-free PWA. Publishing it to
# Pages gives contributors an HTTPS origin, which the camera APIs require —
# getUserMedia and DeviceOrientation will not run over plain HTTP.

on:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - 'HOW-TO-PLUMB.md'
      - 'docs/assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy; just queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Geometry tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The metrology core and the pose logic are the parts that must not ship
      # broken. Files are listed explicitly because `--test <dir>` does not
      # recurse consistently across Node versions.
      - name: Run unit tests
        run: |
          node --test \
            prototype/test/geometry.test.mjs \
            prototype/test/level.test.mjs \
            prototype/test/capture.test.mjs \
            prototype/test/overlay-size.test.mjs

      # Layout bugs have twice looked like "the deploy did nothing": controls
      # scrolled off screen, and the grid drawn into a 300x150 box. Neither is
      # visible to unit tests, so lay the page out in a real browser engine.
      - name: Check layout in headless Chrome
        run: node tools/layout-probe.mjs

  build:
    name: Build site
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r prototype/* _site/
          # Field guide and diagrams travel with the app so a volunteer can
          # reach them from the phone standing in front of the building.
          mkdir -p _site/guide/docs _site/targets
          cp HOW-TO-PLUMB.md _site/guide/
          cp -r docs/assets _site/guide/docs/assets
          # Printable calibration cards, reachable directly from the app.
          cp docs/assets/target-a4.svg docs/assets/target-letter.svg _site/targets/
          # Pages would otherwise run Jekyll and strip files beginning with _.
          touch _site/.nojekyll

      # GitHub Pages serves assets with `Cache-Control: max-age=600` and we
      # reference them by plain path, so a phone that loaded the app within the
      # last ten minutes keeps using its cached CSS and JS — a deploy appears to
      # change nothing. Stamping the commit SHA onto every local asset URL makes
      # each build a fresh URL that cannot be served from a stale cache.
      #
      # ES module imports need the same treatment: `import './lib/x.js'` is a
      # separate request and would otherwise stay cached even when app.js is new.
      - name: Stamp asset version for cache busting
        run: |
          V="${GITHUB_SHA::12}"
          echo "Stamping build $V"

          # HTML entry points
          sed -i "s|href=\"css/style.css\"|href=\"css/style.css?v=$V\"|g" _site/index.html
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$V\"|g" _site/index.html
          sed -i "s|href=\"manifest.webmanifest\"|href=\"manifest.webmanifest?v=$V\"|g" _site/index.html

          # Static and dynamic ES module imports, in app.js and within lib/
          for f in _site/app.js _site/lib/*.js; do
            sed -i -E "s|(from '\./[^']*\.js)'|\1?v=$V'|g" "$f"
            sed -i -E "s|(import\('\./[^']*\.js)'|\1?v=$V'|g" "$f"
          done

          # Expose the build id so the app can display it.
          sed -i "s|__PLUMB_BUILD__|$V|g" _site/index.html _site/app.js

          echo "--- verification ---"
          grep -o 'style.css?v=[0-9a-f]*' _site/index.html | head -1
          grep -o "from '\./lib/geometry.js?v=[0-9a-f]*'" _site/app.js | head -1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
