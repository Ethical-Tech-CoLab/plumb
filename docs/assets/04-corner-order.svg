<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Diagram showing the order to tap the four corners of the calibration target: top-left, top-right, bottom-right, bottom-left, tapping the point where black meets white.">
  <rect width="760" height="380" fill="#f8f9fb"/>
  <text x="380" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1a1f26">Tap the corners in this order — clockwise from top-left</text>
  <text x="380" y="49" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" fill="#495057">Tap the point where <tspan font-weight="700">black meets white</tspan> — the same point you measured between.</text>

  <polygon points="190,105 560,135 540,280 210,250" fill="#fff" stroke="#495057" stroke-width="2"/>

  <g>
    <polygon points="152,101 190,105 186,139 148,134" fill="#1a1f26"/>
    <polygon points="190,105 228,109 224,143 186,139" fill="#fff" stroke="#1a1f26" stroke-width="1"/>
    <polygon points="148,134 186,139 182,173 144,167" fill="#fff" stroke="#1a1f26" stroke-width="1"/>
    <polygon points="186,139 224,143 220,177 182,173" fill="#1a1f26"/>
  </g>
  <g>
    <polygon points="522,132 560,135 558,169 520,166" fill="#1a1f26"/>
    <polygon points="560,135 598,138 596,172 558,169" fill="#fff" stroke="#1a1f26" stroke-width="1"/>
    <polygon points="520,166 558,169 556,203 518,200" fill="#fff" stroke="#1a1f26" stroke-width="1"/>
    <polygon points="558,169 596,172 594,206 556,203" fill="#1a1f26"/>
  </g>
  <g>
    <polygon points="502,277 540,280 538,314 500,311" fill="#1a1f26"/>
    <polygon points="540,280 578,283 576,317 538,314" fill="#fff" stroke="#1a1f26" stroke-width="1"/>
    <polygon points="502,243 540,246 540,280 502,277" fill="#fff" stroke="#1a1f26" stroke-width="1"/>
    <polygon points="540,246 578,249 578,283 540,280" fill="#1a1f26"/>
  </g>
  <g>
    <polygon points="172,245 210,250 206,284 168,279" fill="#1a1f26"/>
    <polygon points="210,250 248,255 244,289 206,284" fill="#fff" stroke="#1a1f26" stroke-width="1"/>
    <polygon points="176,211 214,216 210,250 172,245" fill="#fff" stroke="#1a1f26" stroke-width="1"/>
    <polygon points="214,216 252,221 248,255 210,250" fill="#1a1f26"/>
  </g>

  <text x="375" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#868e96">your printed card, seen at an angle</text>

  <g fill="none" stroke="#d6336c" stroke-width="2" stroke-dasharray="6 4">
    <path d="M 212 108 Q 375 118 538 132"/>
    <path d="M 561 156 Q 553 220 543 258"/>
    <path d="M 518 282 Q 375 268 232 252"/>
  </g>
  <polygon points="543,131 531,126 533,136" fill="#d6336c"/>
  <polygon points="541,263 549,253 538,252" fill="#d6336c"/>
  <polygon points="227,251 239,246 237,256" fill="#d6336c"/>

  <g>
    <circle cx="190" cy="105" r="17" fill="#d6336c"/>
    <text x="190" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff">1</text>
    <circle cx="560" cy="135" r="17" fill="#d6336c"/>
    <text x="560" y="141" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff">2</text>
    <circle cx="540" cy="280" r="17" fill="#d6336c"/>
    <text x="540" y="286" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff">3</text>
    <circle cx="210" cy="250" r="17" fill="#d6336c"/>
    <text x="210" y="256" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff">4</text>
  </g>

  <g font-family="system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#d6336c">
    <text x="190" y="78" text-anchor="middle">top-left</text>
    <text x="606" y="132" text-anchor="start">top-right</text>
    <text x="586" y="312" text-anchor="start">bottom-right</text>
    <text x="190" y="320" text-anchor="middle">bottom-left</text>
  </g>

  <text x="380" y="356" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" fill="#1a1f26">Zoom in before you tap. A few pixels of sloppiness here becomes millimetres of error later.</text>
</svg>
