<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Diagram showing the order to tap the four corners of the calibration target: top-left, top-right, bottom-right, bottom-left.">
  <rect width="760" height="340" fill="#f8f9fb"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1a1f26">Tap the corners in this order — always clockwise from top-left</text>

  <!-- perspective quad -->
  <polygon points="190,90 560,120 540,265 210,235" fill="#fff" stroke="#495057" stroke-width="2.5"/>
  <g fill="#e9ecef">
    <rect x="215" y="105" width="60" height="48" transform="rotate(4 245 129)"/>
    <rect x="475" y="185" width="60" height="48" transform="rotate(4 505 209)"/>
  </g>
  <text x="375" y="182" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#868e96">your printed target, seen at an angle</text>

  <!-- corner markers -->
  <circle cx="190" cy="90" r="19" fill="#d6336c"/>
  <text x="190" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#fff">1</text>
  <text x="190" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#d6336c">top-left</text>

  <circle cx="560" cy="120" r="19" fill="#d6336c"/>
  <text x="560" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#fff">2</text>
  <text x="560" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#d6336c">top-right</text>

  <circle cx="540" cy="265" r="19" fill="#d6336c"/>
  <text x="540" y="271" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#fff">3</text>
  <text x="540" y="297" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#d6336c">bottom-right</text>

  <circle cx="210" cy="235" r="19" fill="#d6336c"/>
  <text x="210" y="241" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#fff">4</text>
  <text x="210" y="267" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#d6336c">bottom-left</text>

  <!-- arrows -->
  <path d="M 215 88 Q 375 96 535 116" fill="none" stroke="#d6336c" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="540,117 528,112 530,122" fill="#d6336c"/>
  <path d="M 558 145 Q 552 205 544 240" fill="none" stroke="#d6336c" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="542,245 550,235 539,234" fill="#d6336c"/>
  <path d="M 515 267 Q 375 254 235 238" fill="none" stroke="#d6336c" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="230,237 242,232 240,242" fill="#d6336c"/>

  <text x="380" y="318" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" fill="#1a1f26">Zoom in before you tap. A few pixels of sloppiness here becomes millimetres of error later.</text>
</svg>
