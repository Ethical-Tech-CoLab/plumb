<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Plan view showing the two-station baseline method: a bridge tower stands in water and cannot be reached, so the known distance is measured between two camera positions on the accessible shore.">
  <rect width="760" height="470" fill="#f8f9fb"/>

  <text x="380" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1a1f26">Can't reach it? Put the known distance on your side</text>
  <text x="380" y="49" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" fill="#495057">Photograph from two places and measure the gap <tspan font-weight="700">between the two camera positions</tspan>.</text>

  <!-- water -->
  <rect x="0" y="72" width="760" height="215" fill="#cfe3f0"/>
  <g stroke="#a8cbe0" stroke-width="1.5" fill="none">
    <path d="M20 110 q18 -6 36 0 t36 0 t36 0 t36 0"/>
    <path d="M300 140 q18 -6 36 0 t36 0 t36 0 t36 0"/>
    <path d="M560 105 q18 -6 36 0 t36 0 t36 0"/>
    <path d="M90 195 q18 -6 36 0 t36 0 t36 0"/>
    <path d="M470 215 q18 -6 36 0 t36 0 t36 0"/>
    <path d="M180 255 q18 -6 36 0 t36 0 t36 0"/>
  </g>
  <text x="60" y="240" font-family="system-ui,sans-serif" font-size="13" fill="#5b90b5">water</text>

  <!-- shore -->
  <rect x="0" y="287" width="760" height="183" fill="#e6e3dc"/>
  <line x1="0" y1="287" x2="760" y2="287" stroke="#9c9a92" stroke-width="2.5"/>
  <text x="30" y="308" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#6d6b64">promenade — where you can walk</text>

  <!-- tower -->
  <g>
    <rect x="330" y="96" width="100" height="120" fill="#b9b2a6" stroke="#7d766a" stroke-width="2.5"/>
    <path d="M348 130 h20 v50 h-20 z M392 130 h20 v50 h-20 z" fill="#8d867a"/>
    <rect x="322" y="86" width="116" height="12" fill="#a49c90" stroke="#7d766a" stroke-width="2"/>
    <text x="380" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#5f594f">bridge tower</text>
    <text x="380" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#c92a2a">✕ can't put a target here</text>
  </g>

  <!-- sight lines -->
  <line x1="200" y1="345" x2="352" y2="220" stroke="#0b7285" stroke-width="2" stroke-dasharray="7 4"/>
  <line x1="560" y1="345" x2="410" y2="220" stroke="#0b7285" stroke-width="2" stroke-dasharray="7 4"/>

  <!-- distance to subject -->
  <g stroke="#868e96" stroke-width="1.4" fill="#868e96">
    <line x1="380" y1="228" x2="380" y2="336"/>
    <polygon points="380,222 375,234 385,234"/>
    <polygon points="380,342 375,330 385,330"/>
  </g>
  <rect x="392" y="268" width="150" height="34" fill="#f8f9fb" opacity="0.9"/>
  <text x="398" y="282" font-family="system-ui,sans-serif" font-size="12" fill="#495057">distance to subject</text>
  <text x="398" y="297" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#495057">z ≈ 150 m</text>

  <!-- camera stations -->
  <g>
    <circle cx="200" cy="345" r="15" fill="#2f9e44"/>
    <text x="200" y="351" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff">A</text>
    <circle cx="560" cy="345" r="15" fill="#2f9e44"/>
    <text x="560" y="351" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff">B</text>
  </g>

  <!-- baseline -->
  <g stroke="#2f9e44" stroke-width="3" fill="#2f9e44">
    <line x1="215" y1="345" x2="545" y2="345"/>
    <polygon points="215,345 229,339 229,351"/>
    <polygon points="545,345 531,339 531,351"/>
  </g>
  <rect x="286" y="330" width="188" height="30" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="380" y="350" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#2f9e44">MEASURE THIS — baseline b</text>

  <!-- rule of thumb -->
  <rect x="150" y="380" width="460" height="34" rx="6" fill="#fff" stroke="#0b7285" stroke-width="1.5"/>
  <text x="380" y="401" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#0b7285">Rule of thumb: make the baseline at least 1/10 of the distance</text>

  <text x="380" y="432" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" fill="#495057">150 m away ⇒ walk 15–30 m between shots. Tape, laser or RTK the baseline — <tspan font-weight="700" fill="#c92a2a">never phone GPS</tspan>.</text>
  <text x="380" y="452" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#868e96">More stations are better: five along the promenade gives redundancy you can inspect.</text>
</svg>
