<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Elevation view showing correct and incorrect placement of the scale target on a building facade.">
  <rect width="760" height="430" fill="#f8f9fb"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1a1f26">Where to put the scale target</text>

  <!-- facade -->
  <rect x="70" y="55" width="620" height="300" fill="#e9d8c4" stroke="#b08968" stroke-width="2"/>
  <!-- brick courses -->
  <g stroke="#d0b89c" stroke-width="1">
    <line x1="70" y1="85" x2="690" y2="85"/><line x1="70" y1="115" x2="690" y2="115"/>
    <line x1="70" y1="145" x2="690" y2="145"/><line x1="70" y1="175" x2="690" y2="175"/>
    <line x1="70" y1="205" x2="690" y2="205"/><line x1="70" y1="235" x2="690" y2="235"/>
    <line x1="70" y1="265" x2="690" y2="265"/><line x1="70" y1="295" x2="690" y2="295"/>
    <line x1="70" y1="325" x2="690" y2="325"/>
  </g>
  <!-- window -->
  <rect x="440" y="120" width="110" height="150" fill="#5c7cfa" opacity="0.35" stroke="#3b5bdb" stroke-width="2"/>
  <text x="495" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3b5bdb">window</text>

  <!-- cornice (off-plane) -->
  <rect x="70" y="42" width="620" height="16" fill="#c99b73" stroke="#8a5a3b" stroke-width="1.5"/>
  <text x="128" y="38" font-family="system-ui,sans-serif" font-size="11" fill="#8a5a3b">cornice — sticks out, NOT on this plane</text>

  <!-- GOOD target -->
  <g>
    <rect x="150" y="185" width="90" height="60" fill="#fff" stroke="#2f9e44" stroke-width="3"/>
    <rect x="158" y="193" width="20" height="20" fill="#1a1f26"/>
    <rect x="212" y="217" width="20" height="20" fill="#1a1f26"/>
    <rect x="212" y="193" width="20" height="20" fill="#adb5bd"/>
    <rect x="158" y="217" width="20" height="20" fill="#adb5bd"/>
    <circle cx="130" cy="215" r="12" fill="#2f9e44"/>
    <text x="130" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">✓</text>
  </g>
  <text x="195" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#2f9e44">YES — flat on the wall</text>
  <text x="195" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#495057">same surface you want to measure,</text>
  <text x="195" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#495057">near the middle of that area</text>

  <!-- BAD 1: on cornice -->
  <rect x="590" y="36" width="52" height="28" fill="#fff" stroke="#d6336c" stroke-width="2.5"/>
  <circle cx="662" cy="50" r="11" fill="#d6336c"/>
  <text x="662" y="55" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#fff">✕</text>
  <text x="616" y="84" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#d6336c">NO — on a surface that</text>
  <text x="616" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#d6336c">sticks out</text>

  <!-- BAD 2: held in hand / not flat -->
  <g transform="translate(300,320) rotate(-18)">
    <rect x="0" y="0" width="70" height="46" fill="#fff" stroke="#d6336c" stroke-width="2.5"/>
  </g>
  <circle cx="288" cy="330" r="11" fill="#d6336c"/>
  <text x="288" y="335" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#fff">✕</text>
  <text x="345" y="392" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#d6336c">NO — tilted or hand-held away from the wall</text>

  <text x="380" y="418" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" fill="#1a1f26">Rule: the target must lie <tspan font-weight="700">flat on the same surface</tspan> you intend to measure.</text>
</svg>
